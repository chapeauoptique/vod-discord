name: VOD YouTube vers Discord

on:
  schedule:
    - cron: "*/15 * * * *"   # vérifie toutes les 15 minutes
  workflow_dispatch:          # bouton pour lancer à la main

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configurer git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Chercher les nouvelles vidéos
        run: python youtube_discord.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}

      - name: Sauvegarder la liste des vidéos postées
        run: |
          git add videos_postees.txt
          git diff --cached --quiet || (git commit -m "MAJ vidéos postées" && git push)

      - name: Garder le bot actif (évite la pause des 60 jours)
        run: |
          derniere=$(git log -1 --format=%ct)
          maintenant=$(date +%s)
          jours=$(( (maintenant - derniere) / 86400 ))
          echo "Dernière activité il y a $jours jours."
          if [ "$jours" -ge 45 ]; then
            git commit --allow-empty -m "Maintien en activité"
            git push
          fi
